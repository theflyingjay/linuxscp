name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Flatpak cargo sources match Cargo.lock
        run: ./scripts/flatpak-cargo-sources.py --check

      - name: Install GTK4, libadwaita and libsecret
        # tcsh: the remote-terminal unit test runs its command under every
        # shell it finds, and csh is the one with the odd syntax.
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libsecret-1-dev gettext openssh-server openssh-client tcsh

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Translation catalogs
        # msgfmt --check catches malformed .po files (bad plural forms,
        # mismatched printf directives). check-po.py covers what it cannot
        # see: a translation that drops a `{}` placeholder, which would
        # silently lose the substituted value at run time.
        run: |
          for po in po/*.po; do msgfmt --check -o /dev/null "$po"; done
          ./scripts/check-po.py

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all --verbose

      - name: Unit tests
        run: cargo test --all --verbose

      - name: Integration tests (local sshd)
        # The tests start ssh with the linuxscp-askpass helper. The library
        # looks for it beside the running binary and one level up (enough
        # for test binaries in target/debug/deps), then on PATH. Since cargo
        # 1.100, test binaries live deeper, under target/debug/build/, so
        # the first lookup misses: put the helper the Build step produced
        # on PATH.
        run: |
          export PATH="$PWD/target/debug:$PATH"
          ./scripts/test-server.sh start
          cargo test -p linuxscp --test sftp_roundtrip --test connect_auth --test ppk_import -- --ignored --test-threads=1
          ./scripts/test-server.sh stop
