[package]
name = "linuxscp"
description = "A commander-style SFTP client for GNOME"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
adw = { version = "0.8", package = "libadwaita", features = ["v1_5"] }
# PuTTY .ppk import (src/ssh/ppk.rs): the PPK container is decoded here and
# re-emitted as an OpenSSH private key with ssh-key, so WinSCP users can
# reuse their keys without puttygen. Pure Rust, no C libraries. ssh-key's
# `rsa` feature is deliberately off: it would pull in the `rsa` crate
# (RUSTSEC-2023-0071) and we only serialize RSA components, never sign.
aes = "0.8"
argon2 = { version = "0.5", default-features = false, features = ["zeroize"] }
base64ct = { version = "1.6", features = ["alloc"] }
cbc = "0.1"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
# Not `std`: that feature's weak `rsa?/std` edge would list the unused `rsa`
# crate in Cargo.lock, where cargo-audit would still flag it.
ssh-key = { version = "0.6", default-features = false, features = ["alloc", "ecdsa", "ed25519", "encryption", "getrandom"] }
zeroize = "1"
anyhow = "1.0.103"
async-channel = "2.5.0"
dirs = "6.0.0"
futures = "0.3.32"
gio = "0.21"
glib = "0.21"
gtk = { version = "0.10.3", package = "gtk4", features = ["v4_12"] }
# Secret Service client (gnome-keyring etc.) via GNOME's C library. Needs
# libsecret-1-dev to build; the runtime library ships with every GNOME
# desktop and the Flatpak runtime.
libsecret = "0.8"
russh-sftp = "2.3.0"
serde = "1.0.228"
serde_json = "1.0.150"
shell-words = "1.1.1"
thiserror = "2.0.18"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs", "net"] }
tokio-util = "0.7.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.4", features = ["v4"] }
